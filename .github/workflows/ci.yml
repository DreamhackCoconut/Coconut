name: Coconut checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web and serverless checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run acceptance tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Build coconut-api bundle
        run: npm run build:functions

  optimizer:
    name: Python optimizer checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/coconut-optimizer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: functions/coconut-optimizer/requirements.txt
      - name: Install optimizer dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run optimizer tests
        run: python -m pytest -q tests

